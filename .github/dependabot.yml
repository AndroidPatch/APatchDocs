version: 2
updates:
  - package-ecosystem: github-actions
    target-branch: main
    directory: /
    schedule:
      interval: weekly
    groups:
      action-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    target-branch: main
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: "all"
    groups:
      npm-dependencies:
        patterns:
          - "*"
